name: CI
on:
  pull_request:
  push:
    branches: ["4.2", "4.0.3"]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run check:versions
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run check:secrets
